services:
  - type: web
    name: tuzataman
    runtime: node
    plan: free
    rootDir: server
    buildCommand: "echo ok"
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CHANNEL
        value: "@tuzataman_uz"
      - key: WEBHOOK
        value: "1"
      - key: STORAGE
        value: telegram
      - key: PAYMENTS
        value: mock
